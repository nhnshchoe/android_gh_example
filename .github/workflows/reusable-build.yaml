name: Reusable Android Build Job

on:
  # 다른 Workflow에서 호출할 수 있도록 정의
  workflow_call:
    inputs:
      # 체크아웃할 브랜치 또는 태그를 입력으로 받음
      git_ref:
        required: true
        type: string
    secrets:
      # 빌드에 필요한 시크릿들을 호출하는 Workflow로부터 받음
      KEYSTORE_BASE64:
        required: true
      KEYSTORE_PASSWORD:
        required: true
      KEY_ALIAS:
        required: true
      KEY_PASSWORD:
        required: true

jobs:
  build:
    runs-on: [ runner1, runner2 ] # Runner 이름으로 Workflow를 수행할 Runner 선택

    steps:
      - name: Checkout
        uses: actions/checkout@v4 # 저장소 코드를 체크아웃
        with:
          ref: ${{ inputs.git_ref }} # 입력으로 받은 git_ref를 사용

      - name: Setup JDK 21
        uses: actions/setup-java@v4 # Java 환경 설정 Action 사용
        with:
          distribution: 'temurin' # OpenJDK 사용
          java-version: '21' # JDK 21 버전 사용

      - name: Setup Android SDK
        # Android SDK 및 라이센스 설정을 위한 Action
        uses: android-actions/setup-android@v3

      - name: Setup signing environment variables
        shell: bash
        run: |
          echo "KEYSTORE_BASE64=${{ secrets.KEYSTORE_BASE64 }}" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew # gradlew 스크립트에 실행 권한 부여

      - name: Build Release APK with Gradle
        # Gradle Wrapper를 사용하여 assembleRelease 태스크 실행
        run: ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4 # 빌드된 APK 업로드
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
