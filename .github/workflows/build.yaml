name: Android Build

on:
  pull_request:
    branches:
      - develop # 'develop' 브랜치에 'pull_request' 이벤트가 발생하면 빌드

jobs:
  build:
    runs-on: runner1 # Runner 이름으로 Workflow를 수행할 Runner 선택

    steps:
      - name: Checkout
        uses: actions/checkout@v4 # 저장소 코드를 체크아웃

      - name: Setup JDK 21
        uses: actions/setup-java@v4 # Java 환경 설정 Action 사용
        with:
          distribution: 'temurin' # OpenJDK 사용
          java-version: '21' # JDK 21 버전 사용

      - name: Setup Android SDK
        # Android SDK 및 라이센스 설정을 위한 Action
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew # gradlew 스크립트에 실행 권한 부여

      - name: Build Relase APK with Gradle
        # Gradle Wrapper를 사용하여 assembleRelease 태스크 실행
        run: ./gradlew assembleRelease && ls app/build/outputs/apk/release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4 # 빌드된 APK 업로드
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
