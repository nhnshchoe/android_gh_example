name: Android Build

on:
  pull_request:
    branches:
      - develop # 'develop' 브랜치에 'pull_request' 이벤트가 발생하면 빌드

jobs:
  build:
    runs-on: runner1 # Runner 이름으로 Workflow를 수행할 Runner 선택

    steps:
      - name: Checkout
        uses: actions/checkout@v4 # 저장소 코드를 체크아웃

      - name: Setup JDK 21
        uses: actions/setup-java@v4 # Java 환경 설정 Action 사용
        with:
          distribution: 'temurin' # OpenJDK 사용
          java-version: '21' # JDK 21 버전 사용

      - name: Setup Android SDK
        # Android SDK 및 라이센스 설정을 위한 Action
        uses: android-actions/setup-android@v3

      - name: Setup signing environment variables
        shell: bash
        run: |
          echo "KEYSTORE_BASE64=${{ secrets.KEYSTORE_BASE64 }}" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew # gradlew 스크립트에 실행 권한 부여

      - name: Build Debug APK with Gradle
        # Gradle Wrapper를 사용하여 assembleDebug 태스크 실행
        run: ./gradlew testDebug assembleDebug

#      - name: Setup Python
#        uses: actions/setup-python@v6
#        with:
#          python-version: '3.14'

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action/linux@v2
        if: (!cancelled())
        with:
          files: |
            build/test-results/**/*.xml

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4 # 빌드된 APK 업로드
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
