name: Manual Build

on:
  workflow_dispatch:
    inputs:
      # Git 참조(브랜치/태그)를 선택할 수 있는 드롭다운 메뉴
      git_ref:
        description: '빌드할 브랜치 또는 태그를 선택하세요.'
        required: true
        type: choice # <-- 'choice' 타입 사용
        default: 'main' # 기본값 설정
        options: # <-- 드롭다운에 표시할 목록
          - main
          - develop

jobs:
  build:
    runs-on: runner1 # Runner 이름으로 Workflow를 수행할 Runner 선택
    permissions:
      checks: write # Checks, PR에 메시지 등록 권한
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4 # 저장소 코드를 체크아웃
        with:
          ref: ${{ github.event.inputs.git_ref }} # 선택된 값(브랜치/태그) 사용

      - name: Setup JDK 21
        uses: actions/setup-java@v4 # Java 환경 설정 Action 사용
        with:
          distribution: 'temurin' # OpenJDK 사용
          java-version: '21' # JDK 21 버전 사용

      - name: Setup Android SDK
        # Android SDK 및 라이센스 설정을 위한 Action
        uses: android-actions/setup-android@v3

      - name: Setup signing environment variables
        shell: bash
        run: |
          echo "KEYSTORE_BASE64=${{ secrets.KEYSTORE_BASE64 }}" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew # gradlew 스크립트에 실행 권한 부여

      - name: Build Release APK with Gradle
        # Gradle Wrapper를 사용하여 assembleRelease 태스크 실행
        run: ./gradlew testRelease assembleRelease

#      - name: Setup Python
#        uses: actions/setup-python@v6
#        with:
#          python-version: '3.13'

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action/linux@v2 # 테스트 리포트 등록
        if: (!cancelled())
        with:
          files: |
            **/build/test-results/testReleaseUnitTest/**/*.xml

      - name: Upload Release APK
        uses: actions/upload-artifact@v4 # 빌드된 APK 업로드
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
